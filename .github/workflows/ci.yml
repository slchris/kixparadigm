name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 亦预装 pwsh（actions/runner-images macos-15-Readme.md:152
        # 列出 PowerShell 7.6.4）→ 该 runner 覆盖/防护的是安装器幂等路径（T2），
        # 不是 pwsh 缺失路径（T1）：T1 的 3 条红在本机（无 pwsh）才可见。
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.16.0', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test zh package (DSH preset)
        run: npm test
      - name: Test en package (DSH preset)
        run: npm test
        working-directory: en

  pack:
    name: pack dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Pack zh package
        run: npm pack --dry-run
      - name: Pack en package
        run: npm pack --dry-run
        working-directory: en
